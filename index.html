<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#d93b81">
  <title>Różowe Vademecum Maturalne 2026</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body>

      <header class="top"><div><span class="eyebrow">NOTATKI DO MATURY</span><h1 id="pageTitle">Plan nauki</h1></div><button id="randomBtn" class="pill">✦ Losuj pytanie</button></header>

    </main>
  </div>
  <script src="app.js"></script>

</html>
