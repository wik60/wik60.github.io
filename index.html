<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#d93b81">
  <title>Różowe Vademecum Maturalne 2026</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='17' fill='%23d93b81'/%3E%3Cpath d='M32 49S11 37 11 23c0-11 14-15 21-5 7-10 21-6 21 5 0 14-21 26-21 26Z' fill='white'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="extra.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand"><span>♡</span><div><strong>Vademecum</strong><small>matura 2026</small></div></div>
      <label class="search"><span>⌕</span><input id="search" placeholder="Szukaj lektury, motywu…" autocomplete="off"></label>
      <label class="selected-filter"><input id="selectedOnly" type="checkbox"><span>Tylko zaznaczone</span></label>
      <nav id="nav"></nav>
      <button class="account-btn" id="accountBtn">♡ Zaloguj się</button>
      <div class="progress"><div><span>Postęp</span><b id="progressText">0%</b></div><i><em id="progressBar"></em></i></div>
    </aside>
    <button class="menu" id="menu" aria-label="Otwórz menu">☰</button>
    <main>
      <header class="top"><div><span class="eyebrow">NOTATKI DO MATURY</span><h1 id="pageTitle">Plan nauki</h1></div><div class="top-actions"><span class="sync-state" id="syncState">Zapis lokalny</span><button id="randomBtn" class="pill">✦ Losuj pytanie</button></div></header>
      <section id="content"></section>
    </main>
  </div>
  <dialog id="authDialog" class="auth-dialog"><form method="dialog" class="auth-card"><button class="close" value="cancel" aria-label="Zamknij">×</button><span class="eyebrow">TWOJE KONTO</span><h2 id="authTitle">Zaloguj się</h2><p id="authHint">Postęp i notatki będą dostępne na każdym urządzeniu.</p><label>E-mail<input id="authEmail" type="email" autocomplete="email" required></label><label>Hasło<input id="authPassword" type="password" autocomplete="current-password" minlength="6" required></label><p class="form-error" id="authError"></p><button type="button" class="primary" id="authSubmit">Zaloguj się</button><button type="button" class="text-btn" id="authSwitch">Nie masz konta? Zarejestruj się</button></form></dialog>
  <div class="toast" id="toast" role="status"></div>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
